'$schema' = "https://awslabs.github.io/duvet/config/v0.4.0.json"

# The authority spec is prose markdown, not an IETF RFC. Without an explicit
# `format`, duvet applies the `ietf` parser, which silently extracts zero
# requirements from this document rather than failing.
[[specification]]
source = "docs/specs/fx-dev-authority/index.md"
format = "markdown"

# The authority requirements are `implication` because the skills ARE the
# implementation. Each requirement is a rule stated in a prompt document and
# honored by the agent that loads it — there is no hook, CI job, or runtime
# guard to cite, and nothing to unit-test. The citation marks the sentence in
# the skill that carries the rule.
#
# SKILL.md files are markdown, which has no line-comment syntax, so these
# citations live inside HTML comments. That forces a non-default comment style:
# `duvet=`/`duvet#` are used instead of `//=`/`//#` because a bare `//` prefix
# inside an HTML comment is indistinguishable from ordinary prose. The `<!--`
# and `-->` delimiters MUST sit on their own lines — duvet reads the whole line
# after the meta prefix, so a single-line `<!--= ... -->` folds the trailing
# delimiter into the value and fails to parse.
[[source]]
pattern = "skills/**/SKILL.md"
type = "implication"
comment-style = { meta = "duvet=", content = "duvet#" }

[report.json]
enabled = true
path = ".duvet/reports/report.json"
